---
- name: Automate SNOW 
  hosts: localhost
  connection: local
  collections:
    - servicenow.itsm
    
  vars:
    demo_username: "{{ lookup('env', 'SN_USERNAME') }}"
    incident_list: []

  tasks:

    - name: Remove old ServiceNow collection
      become: true
      ansible.builtin.file:
        path: /usr/share/ansible/collections/ansible_collections/servicenow/itsm
        state: absent

    - name: Install ServiceNow collection 2.13.2
      become: true
      ansible.builtin.command:
        cmd: ansible-galaxy collection install servicenow.itsm:2.13.2 -p /usr/share/ansible/collections --force

    - name: Check ServiceNow collection version
      ansible.builtin.command:
        cmd: ansible-galaxy collection list servicenow.itsm
      register: collection_version
      changed_when: false

    - ansible.builtin.debug:
        var: collection_version.stdout_lines

    - name: Install Python 3.11
      become: true
      ansible.builtin.dnf:
        name: python3.11
        state: present

    - ansible.builtin.debug:
        var: collection_version.stdout_lines

    - name: find user created incidents
      servicenow.itsm.incident_info:
        query:
          - sys_created_by: LIKE {{ demo_username }}
            active: = true
        incident_mapping:
          close_code:
            "": ""
      register: incidents

    - name: query incident number and creation time 
      set_fact:
        incident_list: '{{ incident_list + [{"number": item.number, "opened_at": item.opened_at}] }}'
      loop: "{{ incidents.records }}"
      when: incidents

    - name: Create a problem from incident
      servicenow.itsm.problem:
        short_description: "The website is completely down!!!!"
        description: "{{ lookup('env', 'SN_USERNAME') }} created a new problem"
      register: problem
      problem_mapping:
        state:
          "1": new
          "2": assess
          "3": fix_in_progress
          "4": resolved
        problem_state:
          "1": new
          "2": assess
          "3": fix_in_progress
          "4": resolved

    - name: Assign a problem to a user for assessment
      servicenow.itsm.problem:
        number: "{{ problem.record.number }}"
        assigned_to: "{{ lookup('env', 'SN_USERNAME') }}"
        state: 2
        problem_state: 2
        problem_mapping:
          state:
            "1": new
            "2": assess
            "3": fix_in_progress
            "4": resolved
          problem_state:
            "1": new
            "2": assess
            "3": fix_in_progress
            "4": resolved

    - name: Update incident status now that problem has been created
      servicenow.itsm.incident:
        number: "{{ item.number }}"
        state: in_progress
        other:
          problem_id: "{{ problem.record.sys_id }}"
      loop: "{{ incident_list }}"

    - debug:
        msg: "A new problem has been created {{ problem.record.number }}"
